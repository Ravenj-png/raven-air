<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🔓 Raven Debug</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Space Grotesk',sans-serif;background:#04040d;color:#eaeaf5;
  min-height:100vh;padding:30px 20px;display:flex;justify-content:center}
.wrap{width:100%;max-width:720px}
h1{font-size:28px;font-weight:600;margin-bottom:6px;
  background:linear-gradient(100deg,#ff5c8a,#8b5cf6,#22d3ee);
  -webkit-background-clip:text;background-clip:text;color:transparent}
p.sub{color:#9b9bbd;font-size:13px;margin-bottom:22px}
label{display:block;font-family:'JetBrains Mono',monospace;font-size:11px;
  letter-spacing:.18em;color:#ff5c8a;margin-bottom:8px}
textarea,input{width:100%;padding:14px 16px;border-radius:12px;background:rgba(0,0,0,.4);
  border:1px solid rgba(255,255,255,.12);color:#fff;font-size:13px;outline:none;
  font-family:'JetBrains Mono',monospace;line-height:1.5;transition:.2s}
textarea{min-height:150px;resize:vertical}
textarea:focus,input:focus{border-color:#ff5c8a;box-shadow:0 0 0 4px rgba(255,92,138,.14)}
input{text-align:center}
button{padding:14px 26px;border-radius:12px;border:none;cursor:pointer;
  font-family:inherit;font-size:15px;font-weight:600;color:#fff;
  background:linear-gradient(100deg,#ff5c8a,#8b5cf6);
  box-shadow:0 8px 24px rgba(255,92,138,.3);transition:.2s;margin-top:6px}
button:hover{transform:translateY(-1px);box-shadow:0 12px 32px rgba(255,92,138,.45)}
button:active{transform:scale(.97)}
#result{margin-top:20px;padding:20px;border-radius:14px;background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.12);font-family:'JetBrains Mono',monospace;
  font-size:13px;line-height:1.7;white-space:pre-wrap;word-break:break-word;
  color:#b8f5da;min-height:80px}
.gap{margin-bottom:18px}
.hint{font-size:11.5px;color:#9b9bbd;margin-top:8px;font-family:'JetBrains Mono',monospace;
  letter-spacing:.06em}
.copy{margin-top:10px;font-size:12px;padding:10px 18px;background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.15);box-shadow:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>🔓 Raven Debug</h1>
  <p class="sub">Private decrypt tool. Do not share this file.</p>

  <div class="gap">
    <label>ENCRYPTED TEXT (paste from WhatsApp)</label>
    <textarea id="enc" placeholder="Paste the encrypted wall of text here..."></textarea>
  </div>

  <div class="gap">
    <label>SECRET KEY</label>
    <input id="key" value="raven9" />
    <div class="hint">Change this if you change the key in the main site.</div>
  </div>

  <button id="decBtn">DECRYPT →</button>
  <div id="result">Answers will appear here…</div>
</div>

<script>
const $ = s => document.querySelector(s);

function xorText(text, key){
  let out = '';
  for(let i = 0; i < text.length; i++){
    out += String.fromCharCode(text.charCodeAt(i) ^ key.charCodeAt(i % key.length));
  }
  return out;
}
function decrypt(encoded, key){
  try {
    const raw = decodeURIComponent(escape(atob(encoded.trim())));
    return xorText(raw, key);
  } catch(e){
    return '(failed to decrypt — check the text or key)';
  }
}

$('#decBtn').addEventListener('click', () => {
  const enc = $('#enc').value.trim();
  const key = $('#key').value.trim();
  if(!enc){ $('#result').textContent = 'Paste the encrypted text first.'; return; }
  if(!key){ $('#result').textContent = 'Enter the secret key.'; return; }
  const result = decrypt(enc, key);
  $('#result').textContent = result;
});
</script>
</body>
</html>
